<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Expense Tracker</title>
<style>
  :root {
    --bg:#ffffff; --ink:#1c1c1e; --muted:#8a8a8e; --line:#e8e8ea;
    --blue:#0a84ff; --blue-ink:#ffffff; --green:#1fa150; --red:#e0352b;
    --row-alt:#f7f7f8; --pill-bg:#efeff1;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#111113; --ink:#f2f2f3; --muted:#98989d; --line:#2a2a2d;
      --blue:#0a84ff; --blue-ink:#ffffff; --green:#34c267; --red:#ff5449;
      --row-alt:#17171a; --pill-bg:#1e1e21;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#111113; --ink:#f2f2f3; --muted:#98989d; --line:#2a2a2d;
    --blue:#0a84ff; --blue-ink:#ffffff; --green:#34c267; --red:#ff5449;
    --row-alt:#17171a; --pill-bg:#1e1e21;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink); height:100%;
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column;
  }
  body::before {
    content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px);
    background:var(--bg); z-index:10;
  }

  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px 2px;
  }
  .back { color:var(--blue); font-size:1.02rem; display:flex; align-items:center; gap:2px; }
  .icon-btn { background:none; border:0; color:var(--blue); font-size:1.15rem; padding:6px; }

  h1 { font-size:2rem; font-weight:800; letter-spacing:.3px; margin:4px 16px 12px; }

  .tabs { display:flex; gap:6px; margin:0 16px 12px; background:var(--pill-bg); border-radius:10px; padding:3px; }
  .tabs button {
    flex:1; border:0; background:transparent; padding:9px 6px; border-radius:8px;
    font-size:.95rem; color:var(--ink); display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .tabs button.active { background:var(--bg); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.12); }
  .tabs .count {
    background:var(--blue); color:#fff; font-size:.72rem; font-weight:700;
    padding:1px 7px; border-radius:999px;
  }

  .toolbar2 { display:flex; justify-content:flex-end; margin:0 16px 10px; }
  #personFilter {
    font-size:.85rem; color:var(--muted); background:var(--row-alt); border:1px solid var(--line);
    border-radius:8px; padding:6px 9px;
  }

  .table-head {
    display:grid; grid-template-columns: 1.1fr 1.6fr 1fr;
    background:var(--blue); color:var(--blue-ink);
    font-size:.88rem; padding:10px 16px; margin:0 16px; border-radius:10px 10px 0 0;
  }
  .table-head span:last-child { text-align:right; }
  .table-head span:nth-child(2) { text-align:center; }

  main { flex:1; overflow-y:auto; padding-bottom:140px; }

  ul#list { list-style:none; margin:0; padding:0 16px; }
  li.entry {
    display:grid; grid-template-columns: 1.1fr 1.6fr 1fr; align-items:center;
    gap:8px; padding:12px 0; border-bottom:1px solid var(--line);
  }
  li.entry .daycol { display:flex; align-items:center; gap:8px; min-width:0; }
  .avatar {
    width:32px; height:32px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:.72rem; font-weight:700;
  }
  .date { color:var(--muted); font-size:.85rem; }
  .notescol { text-align:center; min-width:0; }
  .desc { font-size:.95rem; overflow-wrap:break-word; }
  .meta { font-size:.76rem; color:var(--muted); margin-top:2px; }
  .amtcol { text-align:right; }
  .amt { font-variant-numeric: tabular-nums; font-weight:600; font-size:1rem; }
  .amt.income { color:var(--green); }
  .amt.expense { color:var(--red); }
  .del {
    display:block; margin-top:2px; border:0; background:none; color:var(--muted);
    font-size:.72rem; padding:2px 0;
  }

  .empty { text-align:center; color:var(--muted); padding:40px 20px; font-size:.92rem; }

  .fab {
    position:fixed; right:18px; bottom:calc(96px + env(safe-area-inset-bottom, 0px));
    width:56px; height:56px; border-radius:50%; border:0; background:var(--blue); color:#fff;
    font-size:1.8rem; line-height:1; box-shadow:0 4px 14px rgba(10,132,255,.4); z-index:20;
  }

  .summary {
    position:fixed; left:0; right:0; bottom:0; z-index:15;
    background:var(--blue); color:var(--blue-ink);
    display:grid; grid-template-columns:1fr 1fr 1fr; text-align:center;
    padding:12px 8px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .summary .label { font-size:.76rem; opacity:.85; margin-bottom:3px; }
  .summary .value { font-size:1.15rem; font-weight:700; font-variant-numeric: tabular-nums; }

  .overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.show { display:flex; }
  .sheet {
    width:100%; max-width:480px; background:var(--bg); border-radius:16px 16px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    max-height:86vh; overflow-y:auto;
  }
  .sheet h2 { margin:2px 0 14px; font-size:1.15rem; }
  .sheet label { display:block; font-size:.78rem; color:var(--muted); margin:10px 0 4px; }
  .sheet input, .sheet select {
    width:100%; padding:11px; border:1px solid var(--line); border-radius:9px;
    background:var(--row-alt); color:var(--ink); font-size:.95rem;
  }
  .typeToggle { display:flex; gap:8px; margin-top:4px; }
  .typeToggle button {
    flex:1; padding:10px; border-radius:9px; border:1px solid var(--line); background:var(--row-alt); color:var(--ink);
  }
  .typeToggle button.active.expense { background:var(--red); border-color:var(--red); color:#fff; }
  .typeToggle button.active.income { background:var(--green); border-color:var(--green); color:#fff; }
  .sheet-actions { display:flex; gap:10px; margin-top:18px; }
  .sheet-actions button { flex:1; padding:13px; border-radius:10px; border:0; font-size:.98rem; font-weight:600; }
  .btn-save { background:var(--blue); color:#fff; }
  .btn-cancel { background:var(--pill-bg); color:var(--ink); }

  input:focus-visible, select:focus-visible, button:focus-visible {
    outline:2px solid var(--blue); outline-offset:1px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="back">‹ Accounts</span>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
  </div>
  <h1>TRANSACTIONS</h1>

  <div class="tabs">
    <button class="active" data-type="all">All <span class="count" id="countAll">0</span></button>
    <button data-type="income">Income</button>
    <button data-type="expense">Expense</button>
  </div>

  <div class="toolbar2">
    <select id="personFilter">
      <option value="all">Everyone</option>
    </select>
  </div>

  <div class="table-head">
    <span>Date</span>
    <span>Notes</span>
    <span>Amount</span>
  </div>

  <main>
    <ul id="list"></ul>
  </main>

  <button class="fab" id="openAdd" aria-label="Add entry">+</button>

  <div class="summary">
    <div>
      <div class="label">Income</div>
      <div class="value" id="sumIncome">0</div>
    </div>
    <div>
      <div class="label">Expense</div>
      <div class="value" id="sumExpense">0</div>
    </div>
    <div>
      <div class="label">Balance</div>
      <div class="value" id="sumBalance">0</div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h2>Add transaction</h2>
      <form id="form">
        <label for="desc">Notes</label>
        <input id="desc" type="text" placeholder="e.g. Groceries" required>

        <label for="amount">Amount (₹)</label>
        <input id="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required>

        <label for="person">Person</label>
        <input id="person" type="text" list="peopleOptions" placeholder="e.g. Dilsha" required>
        <datalist id="peopleOptions"></datalist>

        <label for="category">Category</label>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Health</option>
          <option>Shopping</option>
          <option>Other</option>
        </select>

        <label>Type</label>
        <div class="typeToggle">
          <button type="button" class="expense active" id="typeExpense">Expense</button>
          <button type="button" class="income" id="typeIncome">Income</button>
        </div>
        <input type="hidden" id="type" value="expense">

        <div class="sheet-actions">
          <button type="button" class="btn-cancel" id="cancelAdd">Cancel</button>
          <button type="submit" class="btn-save">Save</button>
        </div>
      </form>
    </div>
  </div>

<script>
(function () {
  var STORE_KEY = 'expense-tracker-entries-v1';
  var THEME_KEY = 'expense-tracker-theme-v1';
  var entries = [];
  var activeType = 'all';

  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) entries = JSON.parse(raw);
  } catch (e) { entries = []; }

  try {
    var theme = localStorage.getItem(THEME_KEY);
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}

  document.getElementById('themeBtn').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  });

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); } catch (e) {}
  }

  function fmt(n) {
    var sign = n < 0 ? '-' : '';
    return sign + '₹' + Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  var PERSON_COLORS = ['#0a84ff', '#e0352b', '#1fa150', '#b08900', '#7a4ca0', '#2f8f8a'];
  function colorFor(name, names) {
    var idx = names.indexOf(name) % PERSON_COLORS.length;
    return PERSON_COLORS[idx < 0 ? 0 : idx];
  }
  function initials(name) {
    var parts = name.trim().split(/\s+/);
    return ((parts[0] || '')[0] || '').toUpperCase() + ((parts[1] || '')[0] || '').toUpperCase();
  }

  function renderSummary() {
    var income = 0, expense = 0;
    entries.forEach(function (e) {
      if (e.type === 'income') income += e.amount; else expense += e.amount;
    });
    document.getElementById('sumIncome').textContent = fmt(income);
    document.getElementById('sumExpense').textContent = fmt(expense);
    document.getElementById('sumBalance').textContent = fmt(income - expense);
    document.getElementById('countAll').textContent = entries.length;
  }

  function renderPeopleOptions() {
    var names = Array.from(new Set(entries.map(function (e) { return e.person; }))).sort();
    var sel = document.getElementById('personFilter');
    var current = sel.value;
    sel.innerHTML = '<option value="all">Everyone</option>';
    names.forEach(function (name) {
      var opt = document.createElement('option');
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
    if (names.indexOf(current) !== -1) sel.value = current;

    var dl = document.getElementById('peopleOptions');
    dl.innerHTML = '';
    names.forEach(function (name) {
      var opt = document.createElement('option');
      opt.value = name;
      dl.appendChild(opt);
    });
    return names;
  }

  function renderList() {
    var names = renderPeopleOptions();
    var personFilter = document.getElementById('personFilter').value;
    var list = document.getElementById('list');
    list.innerHTML = '';

    var shown = entries
      .filter(function (e) { return activeType === 'all' || e.type === activeType; })
      .filter(function (e) { return personFilter === 'all' || e.person === personFilter; })
      .slice()
      .reverse();

    if (shown.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No transactions yet. Tap + to add one.';
      list.appendChild(empty);
      return;
    }

    shown.forEach(function (e) {
      var li = document.createElement('li');
      li.className = 'entry';
      var d = new Date(e.date);
      var dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });

      var daycol = document.createElement('div');
      daycol.className = 'daycol';
      var av = document.createElement('div');
      av.className = 'avatar';
      av.style.background = colorFor(e.person, names);
      av.textContent = initials(e.person);
      var dateSpan = document.createElement('span');
      dateSpan.className = 'date';
      dateSpan.textContent = dateStr;
      daycol.appendChild(av);
      daycol.appendChild(dateSpan);

      var notescol = document.createElement('div');
      notescol.className = 'notescol';
      var desc = document.createElement('div');
      desc.className = 'desc';
      desc.textContent = e.desc;
      var meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = e.person + ' · ' + e.category;
      notescol.appendChild(desc);
      notescol.appendChild(meta);

      var amtcol = document.createElement('div');
      amtcol.className = 'amtcol';
      var amt = document.createElement('div');
      amt.className = 'amt ' + e.type;
      amt.textContent = fmt(e.amount);
      var del = document.createElement('button');
      del.className = 'del';
      del.textContent = 'Delete';
      del.addEventListener('click', function () {
        entries = entries.filter(function (x) { return x.id !== e.id; });
        save(); renderAll();
      });
      amtcol.appendChild(amt);
      amtcol.appendChild(del);

      li.appendChild(daycol);
      li.appendChild(notescol);
      li.appendChild(amtcol);
      list.appendChild(li);
    });
  }

  function renderAll() { renderSummary(); renderList(); }

  document.querySelectorAll('.tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.tabs button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activeType = btn.getAttribute('data-type');
      renderList();
    });
  });

  document.getElementById('personFilter').addEventListener('change', renderList);

  var overlay = document.getElementById('overlay');
  var typeField = document.getElementById('type');
  var typeExpenseBtn = document.getElementById('typeExpense');
  var typeIncomeBtn = document.getElementById('typeIncome');

  function openSheet() { overlay.classList.add('show'); document.getElementById('desc').focus(); }
  function closeSheet() { overlay.classList.remove('show'); }

  document.getElementById('openAdd').addEventListener('click', openSheet);
  document.getElementById('cancelAdd').addEventListener('click', closeSheet);
  overlay.addEventListener('click', function (ev) { if (ev.target === overlay) closeSheet(); });

  typeExpenseBtn.addEventListener('click', function () {
    typeField.value = 'expense';
    typeExpenseBtn.classList.add('active');
    typeIncomeBtn.classList.remove('active');
  });
  typeIncomeBtn.addEventListener('click', function () {
    typeField.value = 'income';
    typeIncomeBtn.classList.add('active');
    typeExpenseBtn.classList.remove('active');
  });

  document.getElementById('form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var desc = document.getElementById('desc').value.trim();
    var amount = parseFloat(document.getElementById('amount').value);
    var person = document.getElementById('person').value.trim();
    var category = document.getElementById('category').value;
    var type = typeField.value;
    if (!desc || !(amount > 0) || !person) return;

    entries.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      desc: desc, amount: amount, person: person, category: category, type: type,
      date: new Date().toISOString()
    });
    save();
    ev.target.reset();
    typeField.value = 'expense';
    typeExpenseBtn.classList.add('active');
    typeIncomeBtn.classList.remove('active');
    closeSheet();
    renderAll();
  });

  renderAll();
})();
</script>
</body>
</html>
